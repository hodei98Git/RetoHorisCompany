<!DOCTYPE html>
<html>

<head>

    <title>Pedido de Pizza</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>La pizza</legend>
            <p>Ingredientes</p>
            <input type="checkbox" name="queso" value="queso" id="queso" />
            <label for="queso">Queso</label><br>
            <input type="checkbox" name="pimiento" value="Pimiento" id="Pimiento" />
            <label for="pimiento">Pimiento</label><br>
            <input type="checkbox" name="cebolla" value="Cebolla" id="Cebolla" />
            <label for="cebolla">Cebolla</label><br>
            <p>Tamaño</p>
            <input type="radio" name="tamaño" value="pequeño" id="pequeño">
            <label for="pequeño"> Pequeña</label><br />
            <input type="radio" name="tamaño" value="mediano" id="mediano">
            <label for="mediano"> Mediana</label><br />
            <input type="radio" name="tamaño" value="grande" id="grande">
            <label for="grande"> Grande</label><br />

        </fieldset>
        <fieldset>
            <legend>Datos de entrega</legend>
            <label for="usuario"> Nombre </label>
            <input type="text" name="usuario" id="usuario" /> <br />
            <label for="usuario"> Dirección </label>
            <input type="text" name="usuario" id="usuario" /> <br />
            <label for="usuario"> Telefono </label>
            <input type="text" name="usuario" id="usuario" /> <br />
            <label for="usuario"> correo </label>
            <input type="text" name="usuario" id="usuario" /> <br />
            <p>Instrucciones especiales</p>
            <textarea rows="6" cols="60" name="Texto">Texto por defecto</textarea>

        </fieldset>
        <fieldset>
            <legend>Método de pago</legend>
            <select>

                <option value="Tarjeta">Tarjeta</option>
                <option value="Efectivo">Efectivo</option>
                <option value="No pagar" selected>No pagar</option>
            </select><br>

        </fieldset>

        <input type="submit" value="OK" />


    </form>








</body>

</html>
